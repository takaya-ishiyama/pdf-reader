name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdf_reader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pdf_reader_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Run API tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pdf_reader_test
        run: cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew :android-app:testDebugUnitTest
