services:
  pdf-reader-db:
    container_name: pdf-reader-postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
      target: "database"
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    env_file:
      - ./postgres/.env
    restart: always
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg-data:
