[tasks.gcp-set-project]
run = "gcloud config set project $PROJECT_ID && gcloud auth configure-docker asia-northeast1-docker.pkg.dev"

[tasks.image-push]
run = "docker build -t $IMAGE_URI . && docker push $IMAGE_URI"

[tasks.deploy]
run = """
gcloud run deploy pdf-reader-api \
  --image "$IMAGE_URI" \
  --region "$REGION" \
  --project "$PROJECT_ID" \
  --platform managed \
  --allow-unauthenticated \
  --service-account "pdf-reader-api@$PROJECT_ID.iam.gserviceaccount.com" \
  --set-env-vars "GCS_BUCKET=$GCS_BUCKET,SIGNED_URL_TTL_SECONDS=3600,DATABASE_MAX_CONNECTIONS=5,DATABASE_MIN_CONNECTIONS=1,DATABASE_ACQUIRE_TIMEOUT_SECS=5,DATABASE_URL_FILE=/var/run/app-secrets/database/database-url" \
  --update-secrets "/var/run/app-secrets/database/database-url=pdf-reader-database-url:latest"
"""

[tasks.generate-migration]
run = """
atlas migrate diff add_some_change \
  --dev-url "docker://postgres/16/dev" \
  --to "file://db/schema.sql" \
  --dir "file://db/migrations"
"""

[tasks.checksum-migrations]
run = """
atlas migrate hash --dir "file://db/migrations"
"""

[tasks.apply-migration]
run = """
atlas migrate apply \
  --url "$DATABASE_URL" \
  --dir "file://db/migrations"
"""

[tasks.seed-new-document-data]
run = """
cargo run --bin register_document -- \
  --database-url-file .local-secrets/database-url \
  --title '利用ガイド' \
  --gcs-object-name 'documents/guide/v1/content.md' \
  --content-hash "sha256:$(sha256sum guide.md | cut -d ' ' -f 1)"
"""
