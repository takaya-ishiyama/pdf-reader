apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pdf-reader-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: pdf-reader-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/pdf-reader/api:TAG
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GCS_BUCKET
              value: pdf-reader-dev-assets
            - name: SIGNED_URL_TTL_SECONDS
              value: "3600"
            - name: DATABASE_MAX_CONNECTIONS
              value: "5"
            - name: DATABASE_MIN_CONNECTIONS
              value: "1"
            - name: DATABASE_ACQUIRE_TIMEOUT_SECS
              value: "5"
            - name: GOOGLE_SERVICE_ACCOUNT_EMAIL
              value: pdf-reader-api@PROJECT_ID.iam.gserviceaccount.com
            - name: DATABASE_URL_FILE
              value: /var/run/app-secrets/database/database-url
          volumeMounts:
            - name: database-url
              mountPath: /var/run/app-secrets/database
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: database-url
          secret:
            secretName: pdf-reader-database-url
            items:
              - key: latest
                path: database-url
