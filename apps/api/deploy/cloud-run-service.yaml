apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: markdown-reader-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: markdown-reader-api@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/markdown-reader/api:TAG
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GCS_BUCKET
              value: your-markdown-bucket
            - name: SIGNED_URL_TTL_SECONDS
              value: "3600"
            - name: DATABASE_MAX_CONNECTIONS
              value: "5"
            - name: DATABASE_MIN_CONNECTIONS
              value: "1"
            - name: DATABASE_ACQUIRE_TIMEOUT_SECS
              value: "5"
            - name: GOOGLE_SERVICE_ACCOUNT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: markdown-reader-google-service-account-email
                  key: latest
            - name: GOOGLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: markdown-reader-google-private-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: markdown-reader-database-url
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 6
